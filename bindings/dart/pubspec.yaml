name: evb_e2ee_dart
description: >-
  Dart/Flutter binding for the Everabyte E2EE core (native library via FFI):
  EVB1 content encryption, key wraps, encrypted names. Pure crypto —
  networking, auth and key storage stay app-side.
version: 0.1.0

environment:
  sdk: ^3.5.0

dev_dependencies:
  test: ^1.25.0

dependencies:
  ffi: ^2.1.0
