[package]
name = "evb-e2ee-ffi"
version = "0.1.0"
edition = "2021"
description = "C ABI FFI surface for the Everabyte E2EE core (Dart/Flutter binding)."

[lib]
name = "evb_e2ee_ffi"
crate-type = ["cdylib", "lib"]

[dependencies]
evb-e2ee-core = { path = "../../../core" }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }
