[package]
name = "evb-e2ee-wasm"
version = "0.1.0"
edition = "2021"
license = "Proprietary"
description = "WASM binding for evb-e2ee-core: browser-side E2EE crypto for the Everabyte web client. Pure crypto/wire-format only — networking, auth and key storage stay app-side."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
evb-e2ee-core = { path = "../../core" }
wasm-bindgen = "0.2"
serde_json = "1"

# OS-randomness under wasm32 (crypto.getRandomValues). Feature-unification
# covers rand 0.8 and fips203's rand_core/getrandom path.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
